name: Build firmware

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12

      - name: Install libraries
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "M5Cardputer"
          git clone --depth 1 https://github.com/tanakamasayuki/EspUsbHost.git "$HOME/Arduino/libraries/EspUsbHost"

      - name: Compile Cardputer firmware
        run: |
          mkdir -p build
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3:USBMode=default,FlashSize=8M,PartitionScheme=default_8MB \
            --output-dir build \
            firmware/EtherTest

      - name: List build output
        run: ls -lah build

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: EtherTest-Cardputer
          path: |
            build/*.bin
            build/*.elf
            build/*.map
          if-no-files-found: error
